<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support Operations Workbench</title><style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#0b0e13;color:#edf1f7}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:42px 24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}h1{margin:0;font-size:38px}p{color:#9ba8b8}.grid{display:grid;grid-template-columns:360px 1fr;gap:24px}.panel{background:#121720;border:1px solid #242c39;border-radius:16px;padding:22px}label{display:block;color:#aeb9c8;font-size:13px;margin:14px 0 6px}input,textarea,select,button{width:100%;font:inherit;border-radius:9px;border:1px solid #303a49;background:#0d1219;color:#edf1f7;padding:11px}textarea{min-height:110px;resize:vertical}button{margin-top:16px;background:#5f7cff;border-color:#5f7cff;font-weight:700;cursor:pointer}.case{padding:16px 0;border-bottom:1px solid #28313e}.case:last-child{border:0}.case-head{display:flex;justify-content:space-between;gap:12px}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.pill{font-size:12px;padding:4px 8px;border-radius:999px;background:#202938}.P1{background:#512530;color:#ffb2be}.P2{background:#493d20;color:#f6d775}.empty{padding:52px 10px;text-align:center;color:#8e9bac}.notice{min-height:20px;color:#8fe2ad;font-size:13px}@media(max-width:820px){.grid{grid-template-columns:1fr}header{display:block}}
</style></head><body><main class="wrap"><header><div><h1>Support Operations Workbench</h1><p>Sanitized, auditable investigation workflow. Customer messaging always requires human approval.</p></div><a href="/docs">API docs →</a></header><div class="grid">
<section class="panel"><h2>New case</h2><form id="form"><label>Subject</label><input name="subject" required minlength="4" placeholder="Webhook returns 500"><label>Description</label><textarea name="description" required minlength="8" placeholder="Include sanitized symptoms, timing, and request ID"></textarea><label>Area</label><select name="area"><option>technical</option><option>access</option><option>billing</option><option>security</option></select><label>Environment</label><select name="environment"><option>unknown</option><option>development</option><option>staging</option><option>production</option></select><label>Customer impact</label><select name="customer_impact"><option>medium</option><option>low</option><option>high</option></select><button>Create investigation</button><p class="notice" id="notice"></p></form></section>
<section class="panel"><div class="case-head"><h2>Case queue</h2><select id="filter" style="width:auto"><option value="">All states</option><option>new</option><option>investigating</option><option>awaiting_approval</option><option>resolved</option></select></div><div id="cases" class="empty">Loading cases…</div></section></div></main>
<script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const q=filter.value?`?status=${filter.value}`:'';const r=await fetch('/api/cases'+q),d=await r.json();cases.className='';cases.innerHTML=d.cases.length?d.cases.map(x=>`<article class="case"><div class="case-head"><strong>${esc(x.safe_case.subject)}</strong><span class="pill ${esc(x.priority)}">${esc(x.priority)}</span></div><p>${esc(x.safe_case.description)}</p><div class="meta"><span class="pill">${esc(x.status)}</span><span class="pill">${esc(x.area)}</span><span class="pill">${esc(x.environment)}</span><span class="pill">${esc(x.assignee||'unassigned')}</span></div></article>`).join(''):'<div class="empty">No cases match this filter.</div>'}filter.onchange=load;form.onsubmit=async e=>{e.preventDefault();notice.textContent='Creating…';const body=Object.fromEntries(new FormData(form));const r=await fetch('/api/cases',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});if(r.ok){form.reset();notice.textContent='Investigation created with redacted evidence.';await load()}else{const d=await r.json();notice.textContent=d.detail||'Could not create case.'}};load()</script></body></html>
