name: Bug report
description: Report a case-workflow defect with synthetic data.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Do not include real tickets, customer data, or credentials.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
