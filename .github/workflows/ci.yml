name: CI
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}"}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m compileall -q app && python -m pytest -q

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build --tag support-operations-workbench:ci .
      - name: Smoke-test container
        run: |
          docker run --detach --name support-operations-workbench-ci --publish 8080:8080 support-operations-workbench:ci
          for attempt in {1..15}; do
            curl --fail http://127.0.0.1:8080/health && exit 0
            sleep 1
          done
          docker logs support-operations-workbench-ci
          exit 1
